			<section><h1 class="accent">v4: la versione di oggi</h1>
<p class="light">
	Stesso motore, <strong>estratto in libreria</strong> (<code>components/</code>), testato, con
	<strong>pareti inclinate</strong>. Sempre web component, sempre dal vivo.
</p>

<div class="wc-stage">
	<shower-previewer></shower-previewer>
</div>

<script src="/css-shower/shower/v4-modern.wc.js"></script>

<style>
	h1 {
		font-size: clamp(2rem, 5vw, 3.2rem);
		margin-bottom: 0.25rem;
	}
	.wc-stage {
		width: 100%;
		max-width: 1200px;
		height: 74vh;
		margin: 0.5rem auto 0;
		background: #fff;
		border-radius: 0.5rem;
		color: #111;
		overflow: hidden;
	}
	shower-previewer {
		display: block;
		width: 100%;
		height: 100%;
	}

	/* CSS override dall'esterno (light DOM): menu a SINISTRA, doccia a DESTRA */
	shower-previewer .previewer {
		height: 100%;
		padding: 0 !important;
	}
	shower-previewer .omega-form-flex {
		display: flex;
		flex-direction: row;
		align-items: stretch;
		gap: 1rem;
		height: 100%;
		max-width: none !important;
	}
	shower-previewer .controls,
	shower-previewer .omega-form-flex > :first-child {
		flex: 0 0 240px;
		overflow: auto;
		padding: 0.5rem;
	}
	shower-previewer .showerPreviewer {
		flex: 1 1 auto !important;
		width: auto !important;
		height: 100% !important;
	}

	/* Allineamento input e label */
	shower-previewer .controls label,
	shower-previewer .omega-form-flex label {
		display: block !important;
		text-align: left !important;
		margin-bottom: 0.25rem !important;
	}
	shower-previewer .controls input[type="number"],
	shower-previewer .controls input[type="range"],
	shower-previewer .omega-form-flex input[type="number"],
	shower-previewer .omega-form-flex input[type="range"] {
		width: 100% !important;
		margin-bottom: 0.5rem !important;
		box-sizing: border-box !important;
	}
	shower-previewer .controls input[type="checkbox"],
	shower-previewer .omega-form-flex input[type="checkbox"] {
		margin-right: 0.5rem !important;
		margin-bottom: 0.5rem !important;
	}
</style>
