			<section><h1 class="accent">v3: il rendering dinamico</h1>
<p class="light">
	I punti di <strong>pavimento e base</strong> ora sono calcolati in JS, non più solo CSS.
	Ma il vetro <strong>usa ancora lo skew</strong>.
</p>

<div class="wc-stage">
	<shower-previewer></shower-previewer>
</div>

<script src="/css-shower/shower/v3-svg.wc.js"></script>

<style>
	h1 {
		font-size: clamp(2rem, 5vw, 3.2rem);
		margin-bottom: 0.25rem;
	}
	.wc-stage {
		width: 100%;
		max-width: 1200px;
		height: 74vh;
		margin: 0.5rem auto 0;
		background: #fff;
		border-radius: 0.5rem;
		color: #111;
		overflow: hidden;
	}
	shower-previewer {
		display: block;
		width: 100%;
		height: 100%;
	}

	/* ── CSS override dall'esterno (possibile perché light DOM) ──
	   menu di controllo a SINISTRA, doccia a DESTRA */
	shower-previewer .sample {
		display: flex;
		flex-direction: row;
		align-items: stretch;
		gap: 1rem;
		height: 100%;
	}
	shower-previewer .controls {
		flex: 0 0 240px;
		overflow: auto;
		padding: 0.5rem;
	}
	shower-previewer .controls fieldset {
		padding: 4px 8px;
		margin: 2px 0;
	}
	shower-previewer .wrapper {
		flex: 1 1 auto !important;
		width: auto !important;
		height: 100% !important;
	}

	/* Allineamento input e label */
	shower-previewer .controls label {
		display: block !important;
		text-align: left !important;
		margin-bottom: 0.25rem !important;
	}
	shower-previewer .controls input[type="number"],
	shower-previewer .controls input[type="range"] {
		width: 100% !important;
		margin-bottom: 0.5rem !important;
		box-sizing: border-box !important;
	}
	shower-previewer .controls input[type="checkbox"] {
		margin-right: 0.5rem !important;
		margin-bottom: 0.5rem !important;
	}
</style>
